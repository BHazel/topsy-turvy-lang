name: Build & Test
on:
  push:
  workflow_call:
jobs:
  language-toolchain:
    name: Language Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'operetta/**/*.csproj'
      - name: Install PowerShell
        run: |
          dotnet tool update -g powershell
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Build Solution
        run: |
          dotnet build operetta/BWHazel.TopsyTurvy.slnx --no-incremental      
      - name: Install Playwright Browsers
        run: |
          pwsh operetta/BWHazel.TopsyTurvy.WebEditor.E2ETests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps
      - name: Run Topsy Turvy Toolchain Unit Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.Tests
      - name: Run CLI E2E Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.Cli.E2ETests
      - name: Run Web Editor Unit Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.WebEditor.Tests
      - name: Run Web Editor E2E Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.WebEditor.E2ETests
      - name: Run UtopIR Unit Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.UtopIR.Tests
      - name: Run UtopIR E2E Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.UtopIR.E2ETests
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'operetta/**/*.csproj'
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'extensions/vscode/topsy-turvy/package-lock.json'
      - name: Build CLI
        run: |
          dotnet build operetta/BWHazel.TopsyTurvy.Cli
      - name: Install NPM Dependencies
        working-directory: extensions/vscode/topsy-turvy
        run: |
          npm ci
      - name: Compile VS Code Extension
        working-directory: extensions/vscode/topsy-turvy
        run: |
          npm run compile
      - name: Compile VS Code Extension Tests
        working-directory: extensions/vscode/topsy-turvy
        run: |
          npm run compile-tests
      - name: Run Grammar Tests
        working-directory: extensions/vscode/topsy-turvy
        run: |
          npm run test:grammar
      - name: Run Unit Tests
        working-directory: extensions/vscode/topsy-turvy
        run: |
          npm run test:unit
      - name: Install VS Code System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxss1 libxtst6
          sudo apt-get install -y libasound2t64 \
            || sudo apt-get install -y libasound2
      - name: Run Integration Tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:integration
          working-directory: extensions/vscode/topsy-turvy
  apple-app:
    name: Apple Platforms App
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'operetta/**/*.csproj'
      - name: Install iOS Workload
        run: |
          dotnet workload install ios
      - name: Run Embedded Unit Tests
        run: |
          dotnet test operetta/BWHazel.TopsyTurvy.Tests --filter "FullyQualifiedName~BWHazel.TopsyTurvy.Tests.Embedded"
      - name: Build XCFramework
        run: |
          scripts/build-embedded-xcframework.sh
      - name: Run Swift Smoke Tests
        run: |
          xcodebuild test \
            -project apps/apple/TopsyTurvy/TopsyTurvy.xcodeproj \
            -scheme TopsyTurvyToolchainTests \
            -destination 'platform=iOS Simulator,name=iPhone 16'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'operetta/**/*.csproj'
      - name: Build Solution
        run: |
          dotnet build operetta/BWHazel.TopsyTurvy.slnx --no-incremental
      - name: Install dotnetmd
        run: |
          dotnet tool install -g pierodetomi.dotnetmd
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'docs/topsy-turvy/package-lock.json'
      - name: Install NPM Dependencies
        working-directory: docs/topsy-turvy
        run: |
          npm ci
      - name: Generate API Documentation
        working-directory: docs/topsy-turvy
        run: |
          npm run api:generate
      - name: Build Documentation
        working-directory: docs/topsy-turvy
        run: |
          npm run build
